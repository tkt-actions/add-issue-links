name: Release

on:
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'

      - name: Install dependencies
        run: npm ci

      # Opens/updates the "chore(release): version packages" PR when there are
      # unreleased changesets, or does nothing if none remain.
      - name: Create release pull request
        id: changesets
        uses: changesets/action@v1
        with:
          version: npm run changeset:version
          commit: 'chore(release): version packages'
          title: 'chore(release): version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}

      # Determine whether the version currently on disk (i.e. just merged by
      # the release PR) has already been tagged/released.
      - name: Resolve release metadata
        id: meta
        run: |
          set -euo pipefail

          version="$(node -p "require('./package.json').version")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

          if git rev-parse -q --verify "refs/tags/v${version}" >/dev/null; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

      # From here on, only run when the release PR was just merged
      # (no unreleased changesets remain) and this version has not been
      # tagged yet. This keeps the job idempotent for unrelated pushes to
      # `master` and safe to re-run.
      #
      # dist/ is not rebuilt here. changesets/action's `version` command
      # (npm run changeset:version, above) already runs `npm run build` and
      # commits any diff as part of the release PR itself, so by the time
      # that PR is merged, HEAD's dist/ is already fresh -- merging a PR
      # normally satisfies branch protection, so no direct push to `master`
      # is needed to keep it that way.
      - name: Configure git user
        if: steps.changesets.outputs.hasChangesets == 'false' && steps.meta.outputs.should_release == 'true'
        uses: ./.github/actions/git-bot-identity

      - name: Create and push release tags
        if: steps.changesets.outputs.hasChangesets == 'false' && steps.meta.outputs.should_release == 'true'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail

          major="${VERSION%%.*}"
          rest="${VERSION#*.}"
          minor="${rest%%.*}"

          # Exact version tag: must be created fresh, must not already exist.
          git tag -a "v${VERSION}" -m "Release v${VERSION}"
          git push origin "refs/tags/v${VERSION}"

          # Moving major/minor alias tags, force-updated to this release.
          git tag -f -a "v${major}" -m "Release v${VERSION}"
          git tag -f -a "v${major}.${minor}" -m "Release v${VERSION}"
          git push --force origin "refs/tags/v${major}" "refs/tags/v${major}.${minor}"

      - name: Extract release notes from CHANGELOG.md
        if: steps.changesets.outputs.hasChangesets == 'false' && steps.meta.outputs.should_release == 'true'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail

          notes_file="${RUNNER_TEMP}/release-notes.md"

          # Extract the body of the "## <version>" section for this release.
          # Stops at the next "## " heading, or at a standalone "---" rule
          # (CHANGELOG.md's static footer below the Changesets-managed
          # section uses one; changesets/changelog-github itself never
          # emits a bare "---" line, so this is a safe terminator).
          awk -v ver="$VERSION" '
            BEGIN {
              found = 0
              ver_esc = ver
              gsub(/\./, "\\.", ver_esc)
            }
            /^## / {
              if (found) exit
              if ($0 ~ ("^## \\[?v?" ver_esc "\\]?( |$)")) found = 1
              next
            }
            found && /^---[[:space:]]*$/ { exit }
            found { print }
          ' CHANGELOG.md > "$notes_file" || true

          # Trim leading/trailing blank lines.
          sed -i -e '/./,$!d' "$notes_file"
          tac "$notes_file" | sed -e '/./,$!d' | tac > "${notes_file}.trimmed"
          mv "${notes_file}.trimmed" "$notes_file"

      - name: Create GitHub Release
        if: steps.changesets.outputs.hasChangesets == 'false' && steps.meta.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail

          notes_file="${RUNNER_TEMP}/release-notes.md"

          if [[ -s "$notes_file" ]]; then
            gh release create "v${VERSION}" \
              --title "v${VERSION}" \
              --notes-file "$notes_file"
          else
            gh release create "v${VERSION}" \
              --title "v${VERSION}" \
              --generate-notes
          fi
