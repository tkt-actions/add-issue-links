name: Test
on:
  push:
  pull_request:
    types: [opened, ready_for_review]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: 'package.json'
      - name: npm install, build, lint and test
        run: |
          npm install
          npm run check
